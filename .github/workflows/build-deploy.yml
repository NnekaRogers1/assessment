name: Build and Deploy

on:
  workflow_run:
    workflows: ["Build-IAC"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      
      - name: Get ECR repository name from Terraform
        id: terraform-ecr
        working-directory: terraform
        run: |
          terraform init
          ECR_REPO=$(terraform output -raw ecr_repository_name)
          echo "name=$ECR_REPO" >> $GITHUB_OUTPUT
      
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build and push
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.terraform-ecr.outputs.name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
      
      - name: Scan pushed image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ steps.terraform-ecr.outputs.name }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
      
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
      
      - name: Check wizexercise.txt
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.terraform-ecr.outputs.name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker run --rm --entrypoint cat $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG /app/wizexercise.txt
      
      - name: Run Go security scan
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec.sarif ./...'
        continue-on-error: true
      
      - name: Upload Go security results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: gosec.sarif

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      
      - name: Get Terraform outputs
        id: terraform
        working-directory: terraform
        run: |
          terraform init
          ECR_REPO=$(terraform output -raw ecr_repository_name)
          EKS_CLUSTER=$(terraform output -raw eks_cluster_name)
          ECR_URL=$(terraform output -raw ecr_repository_url)
          MONGODB_IP=$(terraform output -raw mongodb_private_ip)
          PUBLIC_SUBNETS=$(terraform output -json public_subnet_ids | jq -r 'join(",")')
          echo "ecr_repo=$ECR_REPO" >> $GITHUB_OUTPUT
          echo "eks_cluster=$EKS_CLUSTER" >> $GITHUB_OUTPUT
          echo "ecr_url=$ECR_URL" >> $GITHUB_OUTPUT
          echo "mongodb_ip=$MONGODB_IP" >> $GITHUB_OUTPUT
          echo "public_subnets=$PUBLIC_SUBNETS" >> $GITHUB_OUTPUT
      
      - name: Generate Kubernetes manifests
        env:
          ECR_URL: ${{ steps.terraform.outputs.ecr_url }}
          MONGODB_IP: ${{ steps.terraform.outputs.mongodb_ip }}
          PUBLIC_SUBNETS: ${{ steps.terraform.outputs.public_subnets }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # replace placeholders in templates
          sed -e "s|\${ecr_url}|$ECR_URL|g" \
              -e "s|\${mongodb_ip}|$MONGODB_IP|g" \
              -e "s|\${public_subnets}|$PUBLIC_SUBNETS|g" \
              -e "s|\${image_tag}|$IMAGE_TAG|g" \
              k8s/secret.yaml.tpl > k8s/secret.yaml
          
          sed -e "s|\${ecr_url}|$ECR_URL|g" \
              -e "s|\${mongodb_ip}|$MONGODB_IP|g" \
              -e "s|\${public_subnets}|$PUBLIC_SUBNETS|g" \
              -e "s|\${image_tag}|$IMAGE_TAG|g" \
              k8s/deployment.yaml.tpl > k8s/deployment.yaml
          
          sed -e "s|\${ecr_url}|$ECR_URL|g" \
              -e "s|\${mongodb_ip}|$MONGODB_IP|g" \
              -e "s|\${public_subnets}|$PUBLIC_SUBNETS|g" \
              -e "s|\${image_tag}|$IMAGE_TAG|g" \
              k8s/ingress.yaml.tpl > k8s/ingress.yaml
          
          cp k8s/namespace.yaml.tpl k8s/namespace.yaml
          cp k8s/serviceaccount.yaml.tpl k8s/serviceaccount.yaml
          cp k8s/clusterrolebinding.yaml.tpl k8s/clusterrolebinding.yaml
          cp k8s/service.yaml.tpl k8s/service.yaml
      
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ steps.terraform.outputs.eks_cluster }} --region ${{ env.AWS_REGION }}
      
      - name: Deploy
        run: |
          echo "Waiting for MongoDB to initialize..."
          sleep 180
          
          kubectl apply -f k8s/namespace.yaml
          kubectl wait --for=condition=Active namespace/tasky --timeout=30s || true
          sleep 5
          
          kubectl apply -f k8s/
